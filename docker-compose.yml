services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
    container_name: motherson-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MOTHERSON_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -l 5
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motherson-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      WorkstationName: ${MOTHERSON_WORKSTATION}
      DemoUsers__OP001__Password: ${DEMO_OP001_PASSWORD:?DEMO_OP001_PASSWORD is required}
      DemoUsers__SP001__Password: ${DEMO_SP001_PASSWORD:?DEMO_SP001_PASSWORD is required}
      DemoUsers__AD001__Password: ${DEMO_AD001_PASSWORD:?DEMO_AD001_PASSWORD is required}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${MOTHERSON_DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      DataProtection__KeyPath: /keys
    volumes:
      - development-keys:/keys
    ports:
      - "${MOTHERSON_APP_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: on-failure

volumes:
  sqlserver-data:
  development-keys:
