services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: motherson-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motherson-web
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      WorkstationName: ${MOTHERSON_WORKSTATION}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${MOTHERSON_DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "${MOTHERSON_APP_PORT}:8080"
    restart: on-failure

volumes:
  sqlserver-data:
